<!DOCTYPE html>
<html>

<head>
  <title>Education</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <div class="page-container">

    <h1 class="text-5xl text-green-400 font-bold mb-10">
      Cyber Awareness
    </h1>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">

      <div class="glass-card">
        <h2 class="text-2xl mb-5 text-blue-400">
          Phishing SMS
        </h2>

        <p>
          Never trust urgent messages asking for OTP,
          MPIN, KYC update, or password.
        </p>
      </div>

      <div class="glass-card">
        <h2 class="text-2xl mb-5 text-yellow-400">
          Fake APKs
        </h2>

        <p>
          Install YONO only from official stores.
        </p>
      </div>

      <div class="glass-card">
        <h2 class="text-2xl mb-5 text-red-400">
          Social Engineering
        </h2>

        <p>
          SBI never asks passwords over SMS or calls.
        </p>
      </div>

    </div>

  </div>

</body>
</html>
