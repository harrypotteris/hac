<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <div class="page-container">

    <h1 class="text-5xl text-blue-400 font-bold mb-10">
      Threat Dashboard
    </h1>

    <div class="grid grid-cols-1 md:grid-cols-4 gap-6">

      <div class="glass-card">
        <h2>Total Scans</h2>
        <p id="totalScans" class="text-4xl mt-5">0</p>
      </div>

      <div class="glass-card">
        <h2>Blocked</h2>
        <p id="blocked" class="text-4xl mt-5 text-red-400">0</p>
      </div>

      <div class="glass-card">
        <h2>Fake APKs</h2>
        <p id="fakeApks" class="text-4xl mt-5 text-yellow-400">0</p>
      </div>

      <div class="glass-card">
        <h2>Users Protected</h2>
        <p class="text-4xl mt-5 text-green-400">800M+</p>
      </div>

    </div>

  </div>

  <script src="../js/dashboard.js"></script>

</body>
</html>
